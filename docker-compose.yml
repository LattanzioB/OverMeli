version: "3.8"

volumes:
  grafana-data:
  prometheus-data:

networks:
  docker_network:
    driver: bridge

services:
  mongodb:
    image: mongo
    env_file: ./.env
    environment:
      - MONGO_INITDB_ROOT_USERNAME=$MONGODB_USER
      - MONGO_INITDB_ROOT_PASSWORD=$MONGODB_PASSWORD
    ports:
      - $MONGODB_LOCAL_PORT:$MONGODB_DOCKER_PORT
    networks:
      - docker_network

  loginapi:
    depends_on:
      - mongodb
    build:
      context: /OverMeli-LoginAPI/.
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=mongodb
      - DB_USER=$MONGODB_USER
      - DB_PASSWORD=$MONGODB_PASSWORD
      - DB_NAME=$MONGODB_DATABASE
      - DB_PORT=$MONGODB_DOCKER_PORT
    networks:
      - docker_network

  meliapi:
    depends_on:
      - mongodb
    build:
      context: /OverMeli-MeliApi/.
      dockerfile: Dockerfile
    ports:
      - "8010:8010"
    environment:
      - DB_HOST=mongodb
      - DB_USER=$MONGODB_USER
      - DB_PASSWORD=$MONGODB_PASSWORD
      - DB_NAME=$MONGODB_DATABASE
      - DB_PORT=$MONGODB_DOCKER_PORT
    networks:
      - docker_network

  frontend:
    build: /OverMeli-Fronted/.
    ports:
      - "8090:8090"
    links:
      - loginapi
      - meliapi
    networks:
      - docker_network

  test:
    build:
      context: /OverMeli-LoginAPI/.
      dockerfile: /test/Dockerfile.test
    depends_on:
      - loginapi
      - mongodb
    environment:
      - DB_HOST=mongodb
      - DB_USER=$MONGODB_USER
      - DB_PASSWORD=$MONGODB_PASSWORD
      - DB_NAME=$MONGODB_DATABASE
      - DB_PORT=$MONGODB_DOCKER_PORT
    networks:
      - docker_network

  grafana:
    image: grafana/grafana
    container_name: grafana
    hostname: grafana
    ports:
      - "3000:3000"
    networks:
      - docker_network

  prometheus:
    image: prom/prometheus
    container_name: prometheus
    hostname: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - docker_network
